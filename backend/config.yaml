# LLM Configuration
llm:
  provider: openai
  api_key: ${OPENAI_API_KEY}  # From env var
  model: gpt-4o-mini
  temperature: 0.7

# Activity Windows
scheduling:
  active_hours_start: 9  # 9 AM
  active_hours_end: 23   # 11 PM
  organic_delay_min: 0.5  # seconds
  organic_delay_max: 3.0  # seconds

# Policy Rules
policy:
  enabled: true
  cooldown_user_seconds: 60
  cooldown_channel_seconds: 30
  cooldown_global_seconds: 10

# Database
database:
  path: data/bot.db

